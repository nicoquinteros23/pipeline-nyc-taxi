services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nyc-taxi-pipeline

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      DBT_PROFILES_DIR: /app/dbt_project
      DUCKDB_PATH: data/warehouse/nyc_taxi_dlt.duckdb

    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./RESULTADOS.md:/app/RESULTADOS.md

    restart: "no"
