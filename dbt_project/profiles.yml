nyc_taxi_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse/nyc_taxi_dlt.duckdb') }}"
      schema: main
      threads: 1
      settings:
        memory_limit: "1GB"
        threads: 2
        preserve_insertion_order: false
        temp_directory: "data/tmp/duckdb"
