version: 2

models:
  - name: dim_zone
    description: "Dimensión de zonas oficial de NYC TLC (rol doble: origen y destino). Granularidad: 1 fila por location_id."
    columns:
      - name: location_id
        tests: [not_null, unique]
      - name: borough
        tests: [not_null]
      - name: zone
        tests: [not_null]

  - name: dim_date
    description: "Dimensión calendario continua desde el primer día del primer mes hasta el último del último mes. Granularidad: 1 fila por día."
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: date
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: month
        tests: [not_null]

  - name: fact_trips
    description: "Vista de hechos de viajes aceptados (sobre int_trips_enriched; sin duplicación física). Granularidad: 1 fila por viaje aceptado."
    columns:
      - name: trip_id
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: pu_location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: do_location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: pickup_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: trip_distance
        tests: [not_null]
      - name: total_amount
        tests: [not_null]

  - name: agg_zone_hour
    description: "Tabla agregada precalculada por zona de origen, fecha y hora de subida."
    columns:
      - name: pu_location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: location_id
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: trips
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]
      - name: avg_duration_min
        tests: [not_null]
