version: 2

sources:
  - name: dlt_staging
    description: "Vistas dinámicas de staging sobre las tablas mensuales cargadas por dlt para los períodos seleccionados."
    schema: staging
    tables:
      - name: yellow_trips_selected
        description: "Unión normalizada de las tablas mensuales staging.yellow_trips_AAAA_MM seleccionadas."
      - name: selected_periods
        description: "Lista de source_month activos en la ejecución actual."

  - name: pipeline_intermediate
    description: "Vistas portables sobre Parquet validados y en cuarentena para los períodos seleccionados."
    schema: intermediate
    tables:
      - name: trips_validated
        description: "Vista consolidada de viajes aceptados de los períodos seleccionados."
      - name: trips_quarantine
        description: "Vista consolidada de viajes rechazados de los períodos seleccionados."
