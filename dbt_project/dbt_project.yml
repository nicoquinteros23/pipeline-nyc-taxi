name: "nyc_taxi_dbt"
version: "1.0.0"
config-version: 2

profile: "nyc_taxi_dbt"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  zones_csv_path: "data/raw/zones/taxi_zone_lookup.csv"
  selected_months: null

models:
  nyc_taxi_dbt:
    staging:
      +schema: dbt_staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
