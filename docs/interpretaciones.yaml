q1: "De las 10 zonas con más viajes, 9 crecieron entre 1,3 % y 19,2 % respecto de marzo de 2024 y solo JFK Airport bajó (-0,8 %); Midtown Center encabeza con 175.034 viajes y East Village (+19,2 %) y Union Sq (+16,3 %) crecieron más que el total (+14,53 %)."
q2: "La hora con mayor ingreso promedio por viaje (promedio de total_amount) son las 5 h en ambos meses (USD 35,58 en 2024 y 33,56 en 2025), pero con pocos viajes (21.431 y 31.995); las 16 h ocupan el tercer puesto en ambos años con unos 210.000 a 221.000 viajes."
q3: "El 74,25 % de los 3.955.293 viajes de marzo de 2025 tuvo cbd_congestion_fee mayor a 0; las cinco zonas con mayor proporción (SoHo, Greenwich Village North y South, Little Italy/NoLiTa y West Village) son del sur de Manhattan y superan el 99,7 %."
q4: "La propina promedio es 26,1 % de la tarifa con tarjeta de crédito (25,18 % en 2024); el 0,0 % de efectivo no es interpretable porque el sistema no registra la propina en efectivo, así que refleja una limitación del dato y no que los pasajeros no den propina."
q5: "Los viajes que empiezan o terminan en JFK o LaGuardia fueron 318.293 en marzo de 2025 (320.262 en 2024, -0,6 %) con una tarifa media de USD 55,29 (55,70 en 2024), unas tres veces la tarifa media general (USD 18,40)."
q6: "pendiente"